name: Build distributables

# Empacota o Video Delay como .zip auto-contido para Mac e Windows.
#
# Triggers:
#   • push de tag `v*.*.*` → build + release no GitHub
#   • workflow_dispatch     → roda manualmente pelo painel do GitHub
#
# Artifacts produzidos:
#   • VideoDelay-mac.zip   (~180MB, arm64)
#   • VideoDelay-win.zip   (~180MB, x64)
#
# Cada job é completamente isolado — não há cache de binários entre runs porque
# o fetch_binaries.py é rápido (90MB+50MB em ~30s) e a validação por hash bate
# em runners limpos.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            artifact_name: VideoDelay-mac.zip
          - os: windows-2022
            target: win-x64
            artifact_name: VideoDelay-win.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        # PyInstaller + Pillow/cairosvg só em build time (ícones e empacotamento).
        # Runtime do app continua stdlib-only.
        run: python -m pip install --upgrade pyinstaller pillow cairosvg

      - name: Install py7zr (Windows mpv vem em .7z)
        if: matrix.os == 'windows-2022'
        run: python -m pip install py7zr

      - name: Fetch ffmpeg + mpv binaries
        env:
          # Sem token, GitHub API tem rate limit de 60 req/h por IP (compartilhado
          # entre todos os runners) e zera rápido. Com token → 1000 req/h.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_binaries.py --target ${{ matrix.target }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app
        run: python build.py --clean --skip-fetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub release with .zip attachments
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VideoDelay-mac.zip/VideoDelay-mac.zip
            artifacts/VideoDelay-win.zip/VideoDelay-win.zip
          body: |
            ## Como instalar

            Baixe o `.zip` da sua plataforma, extraia, e siga o `INSTALL.txt`
            que vem dentro. Sem instalação de FFmpeg/MPV, sem terminal —
            apenas duplo-clique e o navegador abre com o assistente guiado.

            ### Sistemas suportados
            - macOS 11+ (Apple Silicon)
            - Windows 10/11 (x64)

            ### Aviso de segurança na primeira abertura
            Como esta build não é assinada com certificado pago, o sistema
            mostra um aviso na primeira execução. Veja `INSTALL.txt` para
            o procedimento (3 cliques).
